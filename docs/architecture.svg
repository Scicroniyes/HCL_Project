<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" width="1060" height="590" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1060" height="590" fill="#ffffff"/>

  <text x="30" y="34" font-size="22" font-weight="bold" fill="#111827">System architecture</text>
  <text x="30" y="54" font-size="12" fill="#4b5563">Knowledge-Driven IoT Fault Diagnosis Assistant for wind turbines</text>

  <!-- Row 1: data path -->
  <rect x="30" y="80" width="170" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="106" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Simulator</text>
  <text x="115" y="126" font-size="11" fill="#374151" text-anchor="middle">sim1.py (or real sensors)</text>

  <rect x="290" y="80" width="200" height="64" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="390" y="106" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">MQTT broker</text>
  <text x="390" y="126" font-size="11" fill="#374151" text-anchor="middle">Mosquitto / HiveMQ Cloud</text>

  <rect x="580" y="80" width="180" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="670" y="106" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Subscriber service</text>
  <text x="670" y="126" font-size="11" fill="#374151" text-anchor="middle">subscriber.py</text>

  <rect x="850" y="80" width="180" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="940" y="106" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Analyzer</text>
  <text x="940" y="126" font-size="11" fill="#374151" text-anchor="middle">limits + fault ranking</text>

  <!-- Row 1 arrows -->
  <line x1="200" y1="112" x2="288" y2="112" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="244" y="104" font-size="10" fill="#374151" text-anchor="middle">telemetry</text>

  <line x1="490" y1="100" x2="578" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="534" y="93" font-size="10" fill="#374151" text-anchor="middle">telemetry</text>
  <line x1="578" y1="126" x2="492" y2="126" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="534" y="141" font-size="10" fill="#374151" text-anchor="middle">diagnosis</text>

  <line x1="760" y1="100" x2="848" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="804" y="93" font-size="10" fill="#374151" text-anchor="middle">reading</text>
  <line x1="848" y1="126" x2="762" y2="126" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="804" y="141" font-size="10" fill="#374151" text-anchor="middle">result</text>

  <!-- Row 2: storage -->
  <rect x="580" y="210" width="180" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="670" y="236" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">SQLite database</text>
  <text x="670" y="256" font-size="11" fill="#374151" text-anchor="middle">readings, diagnoses</text>

  <rect x="850" y="210" width="180" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="940" y="236" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Profile + knowledge</text>
  <text x="940" y="256" font-size="11" fill="#374151" text-anchor="middle">profile and knowledge JSON</text>

  <line x1="670" y1="144" x2="670" y2="208" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="678" y="180" font-size="10" fill="#374151">save</text>

  <line x1="940" y1="208" x2="940" y2="146" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="948" y="180" font-size="10" fill="#374151">read at start</text>

  <!-- Row 3: dashboard and AI -->
  <rect x="580" y="340" width="180" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="670" y="366" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Dashboard</text>
  <text x="670" y="386" font-size="11" fill="#374151" text-anchor="middle">Streamlit, port 8501</text>

  <rect x="850" y="340" width="180" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="940" y="366" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">User</text>
  <text x="940" y="386" font-size="11" fill="#374151" text-anchor="middle">web browser</text>

  <rect x="270" y="340" width="200" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="370" y="366" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">RAG</text>
  <text x="370" y="386" font-size="11" fill="#374151" text-anchor="middle">ChromaDB + embeddings</text>

  <rect x="30" y="340" width="180" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="120" y="366" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Local LLM</text>
  <text x="120" y="386" font-size="11" fill="#374151" text-anchor="middle">Ollama, llama3.2:3b</text>

  <rect x="270" y="470" width="200" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="370" y="496" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Knowledge document</text>
  <text x="370" y="515" font-size="11" fill="#374151" text-anchor="middle">wind_turbine_faults.md</text>

  <line x1="670" y1="274" x2="670" y2="338" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="678" y="310" font-size="10" fill="#374151">read every 2 s</text>

  <line x1="848" y1="372" x2="762" y2="372" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="805" y="364" font-size="10" fill="#374151" text-anchor="middle">views</text>

  <line x1="578" y1="372" x2="472" y2="372" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="525" y="364" font-size="10" fill="#374151" text-anchor="middle">on request</text>

  <line x1="268" y1="372" x2="212" y2="372" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="364" font-size="10" fill="#374151" text-anchor="middle">prompt</text>

  <line x1="370" y1="468" x2="370" y2="406" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="378" y="440" font-size="10" fill="#374151">indexed</text>

  <!-- Notes -->
  <text x="30" y="440" font-size="11" fill="#4b5563">The explanation is returned through the RAG module</text>
  <text x="30" y="456" font-size="11" fill="#4b5563">to the dashboard, with the sections used as sources.</text>

  <text x="580" y="470" font-size="11" fill="#4b5563">Docker Compose runs the broker, simulator, subscriber and</text>
  <text x="580" y="486" font-size="11" fill="#4b5563">dashboard as containers. Ollama runs on the host machine.</text>

  <!-- Legend -->
  <rect x="580" y="510" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="600" y="522" font-size="10" fill="#374151">Python service</text>
  <rect x="690" y="510" width="14" height="14" rx="3" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="710" y="522" font-size="10" fill="#374151">Data store</text>
  <rect x="780" y="510" width="14" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="800" y="522" font-size="10" fill="#374151">AI component</text>
  <rect x="890" y="510" width="14" height="14" rx="3" fill="#ffedd5" stroke="#ea580c"/>
  <text x="910" y="522" font-size="10" fill="#374151">Messaging</text>
</svg>
